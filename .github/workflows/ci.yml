name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Em PR, a rodada nova cancela a velha; na main, nunca: um deploy no meio (troca do JAR + restart) não pode parar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # COMMITS.md: assunto com no máximo 72 caracteres; só os commits novos (o histórico enviado não é reescrito).
  commits:
    name: Assunto dos commits (até 72 caracteres)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Conferir os assuntos novos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          scripts/check-commit-subject.sh --range "$BASE..$HEAD"

  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.versao.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers usa o Docker do runner; openssl prova as Name Constraints da CA da LAN.
      - name: Verificar (unitários, slice, integração, ArchUnit e Modulith)
        run: ./mvnw -B verify
      - name: Versão do projeto (pom.xml)
        id: versao
        run: echo "version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      # Só no push na main: o mesmo JAR testado vai para a produção e para a release.
      - name: Publicar o papinho.jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: papinho-jar
          path: backend/target/papinho.jar
          if-no-files-found: error
          retention-days: 7
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Ativar pnpm (versão do packageManager)
        run: corepack enable
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papinho
          POSTGRES_USER: papinho
          POSTGRES_PASSWORD: papinho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papinho -d papinho"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # SMTP de teste para o e-mail de recuperação (ID-05); a API HTTP lê as mensagens no e2e.
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/papinho
      DATABASE_USERNAME: papinho
      DATABASE_PASSWORD: papinho
      PAPINHO_PKI_DIR: ${{ github.workspace }}/.ci-pki
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Ativar pnpm
        run: corepack enable
      - name: Gerar papinho.jar
        run: ./mvnw -B -q install -DskipTests
      - name: Subir o Papinho (padrão e perfil lan)
        env:
          # O e2e roda tudo de um IP só; os limites de tentativas reais são provados no IdentityIT.
          PAPINHO_RATE_LIMIT_MULTIPLIER: "10"
          PAPINHO_MAIL_ENABLED: "true"
          PAPINHO_MAIL_FROM: papinho@papinho.test
          PAPINHO_PUBLIC_URL: http://localhost:8080
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"
        run: |
          java -jar backend/target/papinho.jar pki init --ip 127.0.0.1 --network 127.0.0.0/8
          nohup java -jar backend/target/papinho.jar --server.port=8080 > papinho.log 2>&1 &
          nohup java -jar backend/target/papinho.jar --spring.profiles.active=lan \
            --app.pki.http-port=8081 --app.pki.public-http-port=8081 --app.pki.public-https-port=8443 \
            > papinho-lan.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fs http://localhost:8080/actuator/health > /dev/null && curl -fs http://localhost:8081/setup > /dev/null && exit 0
            sleep 2
          done
          cat papinho.log papinho-lan.log
          exit 1
      # Firefox e WebKit rodam o spec do UI-05 (aparência própria nos três motores).
      - name: Instalar dependências e navegadores
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Rodar e2e
        working-directory: frontend
        env:
          PAPINHO_E2E_URL: http://localhost:8080
          PAPINHO_E2E_SETUP_URL: http://localhost:8081/setup
          PAPINHO_E2E_MAILPIT_URL: http://localhost:8025
          # O WebKit recusa cookies Secure em http://localhost: ele usa a instância HTTPS do perfil lan.
          PAPINHO_E2E_HTTPS_URL: https://127.0.0.1:8443
        run: pnpm e2e
      # Sempre: o relatório traz as capturas do UI-05 (Chromium, Firefox e WebKit, claro e escuro).
      - name: Relatório do Playwright e logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            papinho.log
            papinho-lan.log

  # Deploy na VPS por um runner self-hosted (label "papinho"): a VPS fica atrás do Cloudflare Tunnel, sem porta de
  # entrada, e o runner abre a conexão de saída para o GitHub. Só depois de todos os jobs de teste (deploy/PRODUCAO.md).
  deploy:
    name: Deploy na VPS (self-hosted)
    needs: [commits, backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, papinho]
    timeout-minutes: 15
    steps:
      # O workspace do runner é persistente e o download extrai por cima: sem limpar, sobraria um JAR antigo.
      - name: Limpar o artifact da rodada anterior
        run: rm -rf artifact
      - uses: actions/download-artifact@v7
        with:
          name: papinho-jar
          path: artifact
      - name: Instalar, reiniciar e conferir (saúde, versão e rollback)
        run: |
          set -euo pipefail
          versao="${{ needs.backend.outputs.version }}"
          test -n "$versao" && test -f artifact/papinho.jar
          echo "Publicando a versão $versao"
          sudo /opt/papinho/deploy.sh "$(realpath artifact/papinho.jar)" "$versao"

  # Depois de um deploy bem-sucedido: tag anotada vX.Y.Z (versão do pom.xml) e GitHub Release com o JAR que foi para a
  # produção. Idempotente: com a versão já publicada, não cria nada (suba a versão no pom.xml para gerar outra).
  release:
    name: Release (tag vX.Y.Z + GitHub Release)
    needs: [backend, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v7
        with:
          name: papinho-jar
          path: artifact
      - name: Criar a tag e a release (se ainda não existirem)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versao="${{ needs.backend.outputs.version }}"
          test -n "$versao"
          case "$versao" in *-SNAPSHOT) echo "Versão $versao é SNAPSHOT: sem release."; exit 0 ;; esac
          tag="v${versao}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} já existe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Papinho ${tag}"
            git push origin "${tag}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} já existe; nada a publicar."
            exit 0
          fi
          mv artifact/papinho.jar "artifact/papinho-${versao}.jar"
          gh release create "${tag}" "artifact/papinho-${versao}.jar" --title "Papinho ${tag}" --generate-notes --verify-tag
