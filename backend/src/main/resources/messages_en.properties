# Validation constraint messages (IN-01): the MessageSource looks up the annotation code before the Hibernate
# Validator text. Arguments: {0} is the field and the attributes follow in alphabetical order (Size: {1} max, {2} min).
NotBlank=cannot be blank
NotNull=is required
NotEmpty=cannot be empty
Size=must have from {2} to {1} (characters or items)
Min=must be at least {1}
Max=must be at most {1}
Pattern=has an invalid format
PositiveOrZero=cannot be negative
Email=must be a valid e-mail address
