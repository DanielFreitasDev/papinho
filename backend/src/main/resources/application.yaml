# Configuração base de todos os ambientes. Segredos e valores do ambiente vêm de variáveis (12-factor).
spring:
  application:
    name: papinho
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/papinho}
    username: ${DATABASE_USERNAME:papinho}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      # Publicação concluída sai da tabela: o registro só guarda o que ainda falta entregar.
      completion-mode: delete
  lifecycle:
    timeout-per-shutdown-phase: 30s
  docker:
    compose:
      enabled: false

server:
  port: ${PAPINHO_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${PAPINHO_FORWARD_HEADERS:none}
  http2:
    enabled: true
  compression:
    enabled: true
    additional-mime-types: application/problem+json
  # Manifesto do PWA (NT-04) com o tipo certo: com nosniff, o navegador não adivinha.
  mime-mappings:
    webmanifest: application/manifest+json
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      # O cookie da sessão é definido em shared/security/SessionCookieConfig (ADR 0003).
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    java:
      enabled: true
  metrics:
    web:
      server:
        # São ~190 rotas: com o limite padrão (100), o Micrometer descarta as que passam dele e avisa no log.
        max-uri-tags: 300

logging:
  level:
    root: INFO
    io.github.labdev2025cmd.papinho: INFO
    org.hibernate.SQL: WARN

app:
  security:
    hsts: ${PAPINHO_HSTS:false}
    # Só para e2e (tudo de um IP): multiplica os limites de tentativas. Nunca mude em produção.
    rate-limit-multiplier: ${PAPINHO_RATE_LIMIT_MULTIPLIER:1}
  pki:
    enabled: false
    dir: ${PAPINHO_PKI_DIR:${user.home}/.papinho/pki}
    http-port: ${PAPINHO_HTTP_PORT:8080}
    public-http-port: ${PAPINHO_PUBLIC_HTTP_PORT:80}
    public-https-port: ${PAPINHO_PUBLIC_HTTPS_PORT:443}
  crypto:
    key: ${PAPINHO_CRYPTO_KEY:}
    key-file: ${PAPINHO_DATA_DIR:${user.home}/.papinho}/secret.key
  storage:
    dir: ${PAPINHO_STORAGE_DIR:${PAPINHO_DATA_DIR:${user.home}/.papinho}/files}
  media:
    # Uploads tus em andamento (sempre em disco local, mesmo com armazenamento S3).
    upload-dir: ${PAPINHO_UPLOAD_DIR:${PAPINHO_DATA_DIR:${user.home}/.papinho}/uploads}
    upload-expiry: 24h
    # Arquivo enviado que não virou anexo, figurinha nem foto de grupo nesse prazo sai do servidor (MD-01).
    unused-file-expiry: 24h
    clamav:
      enabled: ${PAPINHO_CLAMAV_ENABLED:false}
      host: ${PAPINHO_CLAMAV_HOST:localhost}
      port: ${PAPINHO_CLAMAV_PORT:3310}
  # GIFs por provedor externo (MS-10): desligado por padrão; "tenor" com PAPINHO_GIFS_API_KEY liga.
  gifs:
    provider: ${PAPINHO_GIFS_PROVIDER:none}
    api-key: ${PAPINHO_GIFS_API_KEY:}
  link-preview:
    enabled: ${PAPINHO_LINK_PREVIEW:true}
    cache-ttl: 24h
  # E-mail de recuperação (ID-05): desligado por padrão. Ligado, exige o remetente, o endereço público usado nos
  # links e o servidor SMTP em spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME...).
  mail:
    enabled: ${PAPINHO_MAIL_ENABLED:false}
    from: ${PAPINHO_MAIL_FROM:}
    public-url: ${PAPINHO_PUBLIC_URL:}
  # Web Push (NT-01): o servidor fala com os serviços de push dos navegadores (exige internet).
  push:
    enabled: ${PAPINHO_PUSH_ENABLED:true}
    subject: ${PAPINHO_PUSH_SUBJECT:https://github.com/labdev2025-cmd/papinho}
  identity:
    webauthn:
      rp-id: ${PAPINHO_RP_ID:localhost}
      allowed-origins: ${PAPINHO_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
