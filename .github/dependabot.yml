version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Fica na versão que o @huggingface/transformers pede (ADR 0008, onnxruntime-web.test.ts): sobe junto com ele.
      - dependency-name: onnxruntime-web
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
