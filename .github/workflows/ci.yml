name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Rodada manual num branch: testes completos e a imagem publicada só com a tag do commit (sem deploy nem release).
  workflow_dispatch:

# Em PR, a rodada nova cancela a velha; na main, nunca: um deploy no meio (troca do JAR + restart) não pode parar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # COMMITS.md: assunto com no máximo 72 caracteres; só os commits novos (o histórico enviado não é reescrito).
  commits:
    name: Assunto dos commits (até 72 caracteres)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Conferir os assuntos novos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          scripts/check-commit-subject.sh --range "$BASE..$HEAD"

  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.versao.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers usa o Docker do runner; openssl prova as Name Constraints da CA da LAN.
      - name: Verificar (unitários, slice, integração, ArchUnit e Modulith)
        run: ./mvnw -B verify
      - name: Versão do projeto (pom.xml)
        id: versao
        run: echo "version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      # No push na main (e na rodada manual): o mesmo JAR testado vai para a produção, para a imagem e para a release.
      # Ele passa pelo cache do Actions (10 GB por repositório), não por artifact: a cota de artifacts é da conta
      # inteira e enche com os outros projetos.
      - name: Separar o papinho.jar
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: mkdir -p dist && cp backend/target/papinho.jar dist/papinho.jar
      - name: Guardar o papinho.jar para o deploy
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: dist/papinho.jar
          key: papinho-jar-${{ github.run_id }}
      - name: Relatórios de teste
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Ativar pnpm (versão do packageManager)
        run: corepack enable
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    # Repositório privado roda em runner de 2 vCPUs (o público tem 4): a suíte passa dos 30 min.
    timeout-minutes: 60
    needs: [frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: papinho
          POSTGRES_USER: papinho
          POSTGRES_PASSWORD: papinho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papinho -d papinho"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # SMTP de teste para o e-mail de recuperação (ID-05); a API HTTP lê as mensagens no e2e.
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/papinho
      DATABASE_USERNAME: papinho
      DATABASE_PASSWORD: papinho
      PAPINHO_PKI_DIR: ${{ github.workspace }}/.ci-pki
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
      - name: Ativar pnpm
        run: corepack enable
      - name: Gerar papinho.jar
        run: ./mvnw -B -q install -DskipTests
      - name: Subir o Papinho (padrão e perfil lan)
        env:
          # O e2e roda tudo de um IP só; os limites de tentativas reais são provados no IdentityIT.
          PAPINHO_RATE_LIMIT_MULTIPLIER: "10"
          PAPINHO_MAIL_ENABLED: "true"
          PAPINHO_MAIL_FROM: papinho@papinho.test
          PAPINHO_PUBLIC_URL: http://localhost:8080
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"
        run: |
          java -jar backend/target/papinho.jar pki init --ip 127.0.0.1 --network 127.0.0.0/8
          nohup java -jar backend/target/papinho.jar --server.port=8080 > papinho.log 2>&1 &
          nohup java -jar backend/target/papinho.jar --spring.profiles.active=lan \
            --app.pki.http-port=8081 --app.pki.public-http-port=8081 --app.pki.public-https-port=8443 \
            > papinho-lan.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fs http://localhost:8080/actuator/health > /dev/null && curl -fs http://localhost:8081/setup > /dev/null && exit 0
            sleep 2
          done
          cat papinho.log papinho-lan.log
          exit 1
      # Firefox e WebKit rodam o spec do UI-05 (aparência própria nos três motores).
      - name: Instalar dependências e navegadores
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Rodar e2e
        working-directory: frontend
        env:
          PAPINHO_E2E_URL: http://localhost:8080
          PAPINHO_E2E_SETUP_URL: http://localhost:8081/setup
          PAPINHO_E2E_MAILPIT_URL: http://localhost:8025
          # O WebKit recusa cookies Secure em http://localhost: ele usa a instância HTTPS do perfil lan.
          PAPINHO_E2E_HTTPS_URL: https://127.0.0.1:8443
        run: pnpm e2e
      # Só em falha (a cota de artifacts é da conta inteira): o relatório traz as capturas e os traces.
      - name: Relatório do Playwright e logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            papinho.log
            papinho-lan.log

  # Deploy na VPS por um runner self-hosted (label "papinho"): a VPS fica atrás do Cloudflare Tunnel, sem porta de
  # entrada, e o runner abre a conexão de saída para o GitHub. Só depois de todos os jobs de teste (deploy/PRODUCAO.md).
  deploy:
    name: Deploy na VPS (self-hosted)
    needs: [commits, backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, papinho]
    timeout-minutes: 15
    steps:
      # O workspace do runner é persistente: sem limpar, um JAR de outra rodada poderia ficar no lugar.
      - name: Limpar o JAR da rodada anterior
        run: rm -rf dist
      - uses: actions/cache/restore@v6
        with:
          path: dist/papinho.jar
          key: papinho-jar-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Instalar, reiniciar e conferir (saúde, versão e rollback)
        run: |
          set -euo pipefail
          versao="${{ needs.backend.outputs.version }}"
          test -n "$versao" && test -f dist/papinho.jar
          echo "Publicando a versão $versao"
          sudo /opt/papinho/deploy.sh "$(realpath dist/papinho.jar)" "$versao"

  # Depois de um deploy bem-sucedido: imagem Docker no GHCR (amd64 e arm64), tag anotada vX.Y.Z e GitHub Release, todas
  # com o JAR que foi para a produção (versão do pom.xml). Idempotente: com a versão já publicada, não cria nada (suba
  # a versão no pom.xml para gerar outra). Na rodada manual, publica só a imagem com a tag do commit, sem release.
  release:
    name: Release e imagem no GHCR
    needs: [commits, backend, frontend, e2e, deploy]
    if: >-
      !cancelled() && needs.backend.result == 'success' && needs.e2e.result == 'success' &&
      (needs.deploy.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/danielfreitasdev/papinho
      VERSAO: ${{ needs.backend.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Decidir o que publicar
        id: plano
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$VERSAO"
          curto="${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Rodada manual: só a imagem ${IMAGE}:sha-${curto}."
            echo "modo=teste" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:sha-${curto}" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSAO" == *-SNAPSHOT ]]; then
            echo "Versão $VERSAO é SNAPSHOT: sem release nem imagem."
            echo "modo=nada" >> "$GITHUB_OUTPUT"
          elif gh release view "v${VERSAO}" >/dev/null 2>&1; then
            echo "Release v${VERSAO} já existe; nada a publicar."
            echo "modo=nada" >> "$GITHUB_OUTPUT"
          else
            echo "modo=release" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<FIM"
              echo "${IMAGE}:${VERSAO}"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:sha-${curto}"
              echo "FIM"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/restore@v6
        if: steps.plano.outputs.modo != 'nada'
        with:
          path: dist/papinho.jar
          key: papinho-jar-${{ github.run_id }}
          fail-on-cache-miss: true
      # O JAR é o mesmo nas duas arquiteturas; o QEMU só roda o passo que cria o usuário da imagem no arm64.
      - uses: docker/setup-qemu-action@v4
        if: steps.plano.outputs.modo != 'nada'
      - uses: docker/setup-buildx-action@v4
        if: steps.plano.outputs.modo != 'nada'
      - uses: docker/login-action@v4
        if: steps.plano.outputs.modo != 'nada'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Construir e publicar a imagem (linux/amd64 e linux/arm64)
        if: steps.plano.outputs.modo != 'nada'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: jar=dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plano.outputs.tags }}
          build-args: |
            VERSION=${{ env.VERSAO }}
            REVISION=${{ github.sha }}
      - name: Criar a tag e a release (com o JAR, o .sha256 e o docker pull)
        if: steps.plano.outputs.modo == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSAO}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} já existe."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Papinho ${tag}"
            git push origin "${tag}"
          fi
          (cd dist && sha256sum papinho.jar > papinho.jar.sha256)
          cat > dist/notas.md <<EOF
          Imagem Docker (linux/amd64 e linux/arm64):

          \`\`\`sh
          docker pull ${IMAGE}:${VERSAO}
          \`\`\`

          JAR: \`papinho.jar\` (Java 25), conferido com \`sha256sum -c papinho.jar.sha256\`.
          EOF
          gh release create "${tag}" dist/papinho.jar dist/papinho.jar.sha256 --title "Papinho ${tag}" \
            --notes-file dist/notas.md --generate-notes --verify-tag
